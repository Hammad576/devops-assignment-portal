
name: Assignment Portal CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests and send report
        env:
          REPORT_RECEIVER_URL: ${{ secrets.REPORT_RECEIVER_URL }}
        run: |
          set +e

          pytest -v \
            --json-report \
            --json-report-file=pytest-report.json

          TEST_EXIT_CODE=$?

          echo "Pytest exit code: $TEST_EXIT_CODE"

          python receiver/generate_report.py

          REPORT_EXIT_CODE=$?

          echo "Report generator exit code: $REPORT_EXIT_CODE"

          if [ "$REPORT_EXIT_CODE" -ne 0 ]; then
            echo "Failed to send test report."
            exit "$REPORT_EXIT_CODE"
          fi

          exit "$TEST_EXIT_CODE"

  deploy:
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
